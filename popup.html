<!-- popup.html —— 插件小弹窗：只负责打开工作台页面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px;
           font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: #222; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .tip { color: #666; font-size: 12px; margin-bottom: 10px; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 6px;
             background: #1a73e8; color: #fff; font-size: 13px; cursor: pointer; }
    button:hover { background: #1667cf; }
    .meta { margin-top: 10px; font-size: 12px; color: #444; }
  </style>
</head>
<body>
  <h1>简历筛选助手</h1>
  <div class="tip">OCR 与批量处理会打开一个独立页面运行（弹窗关闭会中断任务）。</div>
  <button id="open">打开工作台</button>
  <div class="meta" id="meta">白名单：加载中…</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
